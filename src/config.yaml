#General application settings
interval: 90                       # seconds, set to 0 for single shot
timeout: 5                         # seconds for each check
http_retries: 2                    # requests retry on failure
ping_count: 3                      # how many ICMP probes per host
max_workers: 20  

# Logging settings
log_file_path: "health.jsonl" 


# Prometheus metrics settings (only active if METRICS=true environment variable is set)
prometheus_port: 8000   

hosts:
  - name: "dns-google"
    ip: 8.8.8.8
  - name: "router"
    ip: 192.168.1.1

